<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ANTI-ANTI | 5J6B Works</title>
  <meta name="description" content="Official links for ANTI-ANTI by 5J6B Works." />
  <style>
    :root{
      --bg:#0b0b0d;
      --panel:#141419;
      --text:#f3f3f5;
      --muted:#a8a8b3;
      --border:#2a2a33;
      --hover:#1e1e26;
      --accent:#ffffff;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      background:linear-gradient(180deg,#0b0b0d 0%,#111116 100%);
      color:var(--text);
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",
        "Noto Sans KR","Noto Sans JP","Noto Sans SC",sans-serif;
      display:flex;
      justify-content:center;
      padding:44px 18px 64px;
    }
    main{width:100%;max-width:620px}
    header{text-align:center;margin-bottom:30px}
    h1{margin:0;font-size:34px;letter-spacing:.03em}
    .studio{margin-top:7px;color:var(--muted);font-size:15px}
    .tagline{margin:18px auto 0;max-width:520px;font-size:16px;line-height:1.65}
    .section{margin-top:26px}
    .section-title{
      margin:0 0 10px 3px;
      color:var(--muted);
      font-size:12px;
      font-weight:700;
      letter-spacing:.14em;
      text-transform:uppercase;
    }
    .links{display:grid;gap:11px}
    a.button{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      min-height:58px;
      padding:15px 18px;
      border:1px solid var(--border);
      border-radius:14px;
      background:var(--panel);
      color:var(--text);
      text-decoration:none;
      transition:background .15s ease,border-color .15s ease,transform .15s ease;
    }
    a.button:hover{
      background:var(--hover);
      border-color:#444451;
      transform:translateY(-1px);
    }
    .label{font-weight:700}
    .sub{
      display:block;
      margin-top:3px;
      color:var(--muted);
      font-size:12px;
      font-weight:400;
    }
    .arrow{flex:0 0 auto;color:var(--muted);font-size:18px}
    footer{margin-top:34px;text-align:center;color:#7f7f8a;font-size:12px}
  </style>
</head>
<body>
  <main>
    <header>
      <h1>ANTI-ANTI</h1>
      <div class="studio">5J6B Works</div>
      <div class="tagline">Only Monsters Become Idols.<br>Psychological Thriller Adventure</div>
    </header>

    <section class="section">
      <div class="section-title">Game</div>
      <div class="links">
        <a class="button" href="https://store.steampowered.com/app/4982060/_Antianti/" target="_blank" rel="noopener noreferrer">
          <span><span class="label">ANTI-ANTI on Steam</span></span><span class="arrow">↗</span>
        </a>
        <a class="button" href="https://store.onstove.com/ko/games/105019" target="_blank" rel="noopener noreferrer">
          <span><span class="label">ANTI-ANTI on STOVE</span></span><span class="arrow">↗</span>
        </a>
        <a class="button" href="https://tumblbug.com/antianti" target="_blank" rel="noopener noreferrer">
          <span><span class="label">ANTI-ANTI on Tumblbug</span></span><span class="arrow">↗</span>
        </a>
      </div>
    </section>

    <section class="section">
      <div class="section-title">Social</div>
      <div class="links">
        <a class="button" href="https://x.com/5j6bworks" target="_blank" rel="noopener noreferrer">
          <span><span class="label">X (Twitter)</span></span><span class="arrow">↗</span>
        </a>
        <a class="button" href="https://www.youtube.com/@5J6B" target="_blank" rel="noopener noreferrer">
          <span><span class="label">YouTube</span></span><span class="arrow">↗</span>
        </a>
        <a class="button" href="https://www.instagram.com/5j6bworks/" target="_blank" rel="noopener noreferrer">
          <span><span class="label">Instagram</span></span><span class="arrow">↗</span>
        </a>
      </div>
    </section>

    <section class="section">
      <div class="section-title">Press Kit</div>
      <div class="links">
        <a class="button" href="https://www.dropbox.com/scl/fo/gnxeeh4ao5i92hqqiiwoh/APjNl7eRL-Ej7xp3J9XtW1o?rlkey=5grn3jd0peuuy9a6ziyakmox6&dl=0" target="_blank" rel="noopener noreferrer">
          <span><span class="label">Press Kit — 한국어</span><span class="sub">Korean</span></span><span class="arrow">↗</span>
        </a>
        <a class="button" href="https://www.dropbox.com/scl/fo/z9iy5kual9qioai8h04zq/APa6T_0iNFgmUhNmBuLcLMU?rlkey=63bvrdo23w4oyhqtua57bfxe2&dl=0" target="_blank" rel="noopener noreferrer">
          <span><span class="label">Press Kit — English</span><span class="sub">English</span></span><span class="arrow">↗</span>
        </a>
        <a class="button" href="https://www.dropbox.com/scl/fo/m1qpckzqhs9bkubrins7f/AOkO6b1g73HgB76JinKdDsg?rlkey=h7kimofdzx8jw47mykohyvna8&dl=0" target="_blank" rel="noopener noreferrer">
          <span><span class="label">Press Kit — 日本語</span><span class="sub">Japanese</span></span><span class="arrow">↗</span>
        </a>
      </div>
    </section>

    <footer>© 5J6B Works</footer>
  </main>
</body>
</html>
